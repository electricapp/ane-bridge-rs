[workspace]
resolver = "2"
members = ["ane-bridge-sys", "ane-bridge"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.95"
license       = "MIT"
repository    = "https://github.com/electricapp/ane-bridge-rs"
homepage      = "https://github.com/electricapp/ane-bridge-rs"
documentation = "https://docs.rs/ane-bridge"
description   = "Generic Apple Neural Engine bridge — compile MIL and dispatch evals from Rust."
keywords      = ["ane", "coreml", "macos", "neural-engine", "ffi"]
categories    = ["api-bindings", "hardware-support", "external-ffi-bindings", "os::macos-apis"]
authors       = ["ane-bridge contributors"]
readme        = "../README.md"

[workspace.dependencies]
ane-bridge-sys = { path = "ane-bridge-sys", version = "0.1.0" }

[profile.release]
opt-level = 3
lto       = "thin"

# Lints are set to "11" deliberately: every unsafe block must carry a SAFETY
# comment, all of clippy's pedantic + nursery + cargo groups are warnings.
# Per-crate selective allows justify the few that fight against FFI realities.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn  = "deny"
missing_docs            = "warn"
unreachable_pub         = "warn"
trivial_casts           = "warn"
trivial_numeric_casts   = "warn"
single_use_lifetimes    = "warn"
unused_lifetimes        = "warn"
nonstandard_style       = { level = "warn", priority = -1 }
future_incompatible     = { level = "warn", priority = -1 }
rust_2018_idioms        = { level = "warn", priority = -1 }
# `loom` is supplied via `RUSTFLAGS='--cfg loom'` for the loom suite —
# register it so non-loom builds don't fire `unexpected_cfgs`.
unexpected_cfgs         = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic                     = { level = "deny", priority = -1 }
nursery                      = { level = "deny", priority = -1 }
cargo                        = { level = "deny", priority = -1 }
restriction                  = { level = "deny", priority = -1 }
# The `restriction` group contains lints that are mutually
# contradictory with the default-on group (e.g. `implicit_return`
# fights `needless_return`) or that nuke universal Rust idiom (e.g.
# `min_ident_chars` forbids `|x| x + 1`). Each entry below names the
# exact reason; nothing else is allowed.
blanket_clippy_restriction_lints = "allow"  # we deliberately enable the group
implicit_return               = "allow"     # contradicts `needless_return` (warn-by-default)
question_mark_used            = "allow"     # `?` is idiomatic error propagation
single_call_fn                = "allow"     # tiny helpers are clearer than inlining
min_ident_chars               = "allow"     # short closure params (`|x|`) are universal idiom
absolute_paths                = "allow"     # `core::ptr::null_mut()` etc. are clearer than imports
mod_module_files              = "allow"     # we use `lib.rs`, not `mod.rs`
self_named_module_files       = "allow"     # paired with `mod_module_files`
arbitrary_source_item_ordering = "allow"    # alphabetical ordering costs grouping clarity
ref_patterns                  = "allow"     # `&raw const` uses ref patterns by design
pub_use                       = "allow"     # re-exporting from `sys` at the crate root is the API
exhaustive_structs            = "allow"     # FFI `repr(C)` structs ARE the C ABI; `#[non_exhaustive]` would break construction
exhaustive_enums              = "allow"     # FFI enums match a fixed C contract; non-exhaustive would defeat the purpose
multiple_crate_versions       = "allow"     # transitive dep duplication is upstream, not under our control
missing_inline_in_public_items = "allow"    # blanket `#[inline]` on every pub fn defeats LLVM's cross-crate inliner heuristics
semicolon_outside_block       = "allow"     # contradicts `semicolon_inside_block`; both styles are idiomatic
semicolon_inside_block        = "allow"     # contradicts `semicolon_outside_block`; both styles are idiomatic
semicolon_if_nothing_returned = "allow"     # paired with `; inside` style — last stmt may legitimately be expression
unseparated_literal_suffix    = "allow"     # contradicts `separated_literal_suffix` — we use `0_usize` for clarity at numeric boundaries
multiple_inherent_impl        = "allow"     # grouping methods by capability (open/run/buffers/...) across `impl` blocks is clearer than one wall
error_impl_error              = "allow"     # `Error` IS the idiomatic public name for a crate's error type
missing_trait_methods         = "allow"     # `Error`'s `source`/`description`/`cause`/`provide`/`type_id` defaults are deliberate
non_ascii_literal             = "allow"     # doctest output strings may contain unicode (e.g. ANE telemetry labels)
default_numeric_fallback      = "allow"     # `0` / `1` literals in math have unambiguous inferred types; verbose suffixes hurt readability
inline_trait_bounds           = "allow"     # `<P: AsRef<Path>>` is universal idiom; a `where` clause per one-bound generic is pure noise
