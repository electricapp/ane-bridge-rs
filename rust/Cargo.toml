[workspace]
resolver = "2"
members = ["ane-bridge-sys", "ane-bridge"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.95"
license       = "MIT"
repository    = "https://github.com/electricapp/ane-bridge-rs"
homepage      = "https://github.com/electricapp/ane-bridge-rs"
documentation = "https://docs.rs/ane-bridge"
description   = "Generic Apple Neural Engine bridge — compile MIL and dispatch evals from Rust."
keywords      = ["ane", "coreml", "macos", "neural-engine", "ffi"]
categories    = ["api-bindings", "hardware-support", "external-ffi-bindings", "os::macos-apis"]
authors       = ["ane-bridge contributors"]
readme        = "../README.md"

[workspace.dependencies]
ane-bridge-sys = { path = "ane-bridge-sys", version = "0.1.0" }

[profile.release]
opt-level = 3
lto       = "thin"

# Lints are set to "11" deliberately: every unsafe block must carry a SAFETY
# comment, all of clippy's pedantic + nursery + cargo groups are warnings.
# Per-crate selective allows justify the few that fight against FFI realities.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn  = "deny"
missing_docs            = "warn"
unreachable_pub         = "warn"
trivial_casts           = "warn"
trivial_numeric_casts   = "warn"
single_use_lifetimes    = "warn"
unused_lifetimes        = "warn"
nonstandard_style       = { level = "warn", priority = -1 }
future_incompatible     = { level = "warn", priority = -1 }
rust_2018_idioms        = { level = "warn", priority = -1 }
# `loom` is supplied via `RUSTFLAGS='--cfg loom'` for the loom suite —
# register it so non-loom builds don't fire `unexpected_cfgs`.
unexpected_cfgs         = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic                     = { level = "warn", priority = -1 }
nursery                      = { level = "warn", priority = -1 }
cargo                        = { level = "warn", priority = -1 }
undocumented_unsafe_blocks   = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc           = "deny"
# Justified allows:
#   These fight the FFI boundary or are stylistic noise that doesn't carry
#   information. Anything truly informative stays a warning.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"
missing_const_for_fn    = "allow"   # const-eval can't see through FFI
multiple_crate_versions = "allow"   # transitive dep duplication is upstream
cargo_common_metadata   = "allow"   # repo-level metadata applied separately
