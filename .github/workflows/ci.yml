name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Deny-all by default; each job re-grants only what it needs.
permissions: {}

# A new push to a PR/branch cancels the prior in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ── Deterministic macOS checks (no ANE hardware required) ──
  #
  # Everything here either lints or COMPILES; nothing runs CoreML/ANE
  # inference, so it works on a hosted runner and is expected to stay green.
  # The ANE-inference steps live in the separate, gated `ane-runtime` job
  # below — GitHub-hosted macOS runners are virtualized and do not expose
  # the Apple Neural Engine (CoreML reports "Host too old, ANE hardware not
  # available" the moment a model is compiled for the ANE).
  macos-checks:
    name: build + test (macOS Apple Silicon)
    # macos-14 and later are Apple Silicon (arm64). The C side
    # (c/src/ane_state.m) builds against CoreML APIs that require the macOS 26
    # SDK: the stateful-prediction surface (MLState, -newState,
    # -predictionFromFeatures:usingState:error:) needs macOS 15, and the
    # MLMultiArrayDataTypeInt8 enumerator is API_AVAILABLE(macos(26.0)). Older
    # SDKs (macos-14 = Xcode 15, macos-15 = Xcode 16) lack these, so the build
    # fails to compile. macos-26 (Xcode 26) ships the SDK the sources need.
    runs-on: macos-26
    # C/Obj-C lint + C build + Rust fmt/clippy/doc/build. No inference.
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # ----- Python (for the identity-model generator script) -----
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # tools/make_identity_model.py drives its CLI with typer + rich; the
      # bare setup-python toolchain has neither, so install them explicitly.
      # Pinned for a reproducible fixture-generation step.
      - name: Install Python deps for fixture generator
        run: python3 -m pip install "typer==0.23.2" "rich==15.0.0"

      # ----- Rust toolchain -----
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          rustc --version
          cargo --version
          python3 --version
          xcrun clang --version

      # ----- Cargo cache -----
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ----- C/Obj-C formatting + static analysis -----
      #
      # clang-format is pinned to a specific LLVM major (llvm@19). Apple's
      # `xcrun clang-format` version is tied to the runner's Xcode and
      # drifts between runner images, so its formatting output is
      # non-deterministic across CI runs — the committed C can be a 0-diff
      # on one image and fail `--Werror` on the next. Pinning Homebrew LLVM
      # makes the format check reproducible and matches the exact version
      # used to reformat the sources. `brew install llvm` (unpinned) stays
      # for clang-tidy, whose analyzer output is far less sensitive to the
      # source layout than to the macOS SDK on the runner.
      - name: Install LLVM (clang-format pinned + clang-tidy)
        run: |
          brew install llvm@19
          brew install llvm

      - name: clang-format (C/Obj-C, --Werror)
        run: |
          "$(brew --prefix llvm@19)/bin/clang-format" --dry-run --Werror \
            c/src/*.m c/src/*.h c/include/*.h c/examples/*.c c/examples/*.m

      - name: clang-tidy (C/Obj-C library, max checks as errors)
        run: |
          "$(brew --prefix llvm)/bin/clang-tidy" \
            c/src/ane_bridge.m c/src/ane_private.m -- \
            -I c/include -fno-objc-arc -x objective-c -isysroot "$(xcrun --show-sdk-path)"

      # ----- C library + example build (-Weverything -Werror via Makefile) -----
      - name: Build dylib + C examples
        run: |
          make
          make examples

      - name: Generate identity model fixture
        run: python3 tools/make_identity_model.py build/identity

      # NOTE: actually RUNNING the C examples (./build/bin/identity, zero_copy)
      # compiles a CoreML model for the ANE and so lives in the gated
      # `ane-runtime` job, not here — a hosted runner has no ANE.

      # ----- Rust formatting -----
      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all -- --check

      # ----- Rust clippy (max lints) -----
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Catches broken intra-doc links and undocumented unsafe items.
      - name: cargo doc (warnings as errors)
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      # ----- Rust build (compile only; running examples/tests is ANE work) -----
      - name: cargo build (release)
        working-directory: rust
        run: cargo build --workspace --release --all-targets

  # ── ANE-runtime lane (requires a real Apple Neural Engine) ──
  #
  # Every step here executes CoreML inference on the ANE: running the C and
  # Rust examples, the integration tests, the heap-guard / loom / TSAN passes,
  # and the `leaks` run all compile a model for the ANE and run it. GitHub's
  # HOSTED macOS runners are virtualized and do NOT expose the Apple Neural
  # Engine, so CoreML fails immediately with:
  #
  #     compileModel:options:qos:error:: Host too old, ANE hardware not available
  #
  # This job therefore targets a SELF-HOSTED Apple-Silicon-with-ANE runner and
  # is gated so it only fires on an explicit opt-in — a manual `workflow_dispatch`
  # run, or a commit message containing the `[ane]` marker. On ordinary PRs and
  # pushes it is skipped (it does not run and does not go red), so it is a ready
  # scaffold for when such a runner is wired up. The steps are moved verbatim
  # from the old single lane — same commands, env, suppressions, and invocations.
  ane-runtime:
    name: ANE runtime (self-hosted Apple Silicon)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ane]')
    runs-on: [self-hosted, macos, ane]
    # Heavy lane: run examples + heap guards + loom + TSAN + leaks on real ANE.
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # ----- Python (for the identity-model generator script) -----
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # tools/make_identity_model.py drives its CLI with typer + rich; the
      # bare setup-python toolchain has neither, so install them explicitly.
      # Pinned for a reproducible fixture-generation step.
      - name: Install Python deps for fixture generator
        run: python3 -m pip install "typer==0.23.2" "rich==15.0.0"

      # ----- Rust toolchain -----
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # ----- Cargo cache -----
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Rebuild the C dylib + examples and regenerate the model fixture: this
      # job runs on a separate runner from `macos-checks`, so it does not share
      # that job's build/ output.
      - name: Build dylib + C examples
        run: |
          make
          make examples

      - name: Generate identity model fixture
        run: python3 tools/make_identity_model.py build/identity

      - name: Run C identity example
        run: ./build/bin/identity build/identity/model.mil build/identity/weights.bin

      - name: Run C zero-copy example
        run: ./build/bin/zero_copy build/identity/model.mil build/identity/weights.bin

      # ----- Rust build + run examples + integration tests -----
      - name: cargo build (release)
        working-directory: rust
        run: cargo build --workspace --release --all-targets

      - name: Run Rust identity example
        working-directory: rust
        run: |
          cargo run --release --example identity -- \
            ../build/identity/model.mil ../build/identity/weights.bin

      - name: Run Rust zero-copy example
        working-directory: rust
        run: |
          cargo run --release --example zero_copy -- \
            ../build/identity/model.mil ../build/identity/weights.bin

      - name: Run Rust async example
        working-directory: rust
        run: |
          cargo run --release --example async_runner -- \
            ../build/identity/model.mil ../build/identity/weights.bin

      - name: cargo test (release)
        working-directory: rust
        run: cargo test --release --workspace

      # ----- Heap-guard runs to catch FFI memory bugs without nightly -----
      #
      # MallocGuardEdges places guard pages around every libsystem_malloc
      # allocation; MallocScribble fills freed memory with 0x55 to catch
      # use-after-free; MallocCheckHeapEach walks the heap every N malloc
      # operations to detect corruption. These are macOS's built-in
      # equivalents to a sanitizer pass and they cross the FFI boundary
      # transparently — Apple's private framework allocations are also
      # protected.
      - name: cargo test under heap guards
        working-directory: rust
        env:
          MallocGuardEdges: "1"
          MallocScribble: "1"
          MallocCheckHeapEach: "100"
          MallocCheckHeapStart: "1"
          MallocErrorAbort: "1"
        run: cargo test --release --workspace --tests

      # ----- loom: exhaustive interleaving check (Rust side) -----
      #
      # Exhaustively explores legal thread interleavings for the
      # `EvalShared` state machine — the atomic+mutex protocol that
      # `EvalFuture` and the completion callback share. Catches
      # missed happens-before relationships and lost-wakeup bugs.
      - name: cargo test under loom
        working-directory: rust
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --release --workspace --test loom_async

      # ----- ThreadSanitizer (C side) -----
      #
      # Builds the C/Obj-C side with `-fsanitize=thread` and re-runs the
      # race regression test + stress test under TSAN. Catches future
      # regressions where someone introduces an unsynchronized global or
      # write-without-fence in `c/src/`. Apple's private framework is
      # NOT TSAN-built so reports originating inside it are filtered by
      # the suppressions file in `c/tsan.supp`.
      - name: cargo test under ThreadSanitizer
        working-directory: rust
        env:
          ANE_BRIDGE_TSAN: "1"
          TSAN_OPTIONS: "halt_on_error=1 suppressions=../c/tsan.supp second_deadlock_stack=1"
        run: |
          # Declare + assign separately so the export doesn't mask clang's
          # exit status (shellcheck SC2155).
          DYLD_LIBRARY_PATH="$(clang --print-runtime-dir):$DYLD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH
          cargo clean -p ane-bridge-sys
          cargo test --release --workspace --test race --test stress

      # ----- macOS `leaks` against the stress binary -----
      #
      # `leaks --atExit -- <binary>` runs the process and reports any
      # unfreed allocations at exit. We point it at the stress test
      # binary so the create/destroy cycles are exercised; the test
      # fails if any leak is reported.
      - name: leaks check on stress tests
        working-directory: rust
        env:
          MallocStackLogging: "1"
        run: |
          # Compile the stress test without running it, then locate the
          # produced binary.
          cargo test --release --workspace --test stress --no-run
          STRESS_BIN=$(find target/release/deps -maxdepth 1 -type f -perm -111 \
                      -name 'stress-*' ! -name '*.d' ! -name '*.dSYM' | head -n1)
          if [ -z "$STRESS_BIN" ]; then
            echo "could not find stress test binary" >&2
            exit 1
          fi
          echo "running leaks against $STRESS_BIN"
          # `leaks --atExit --` waits for the process to finish then
          # scans. Exits non-zero if any leaks are found.
          leaks --atExit --quiet -- "$STRESS_BIN" --test-threads=1

  # ── Supply chain: license / bans / sources policy (deny.toml) ──
  # Runs on Linux against the committed lockfile in `rust/`. Cheap, no
  # macOS minutes — the FFI is irrelevant to the dependency graph.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          # Workspace manifest + config both live under rust/; the action
          # auto-discovers rust/deny.toml next to the manifest.
          manifest-path: rust/Cargo.toml
          command: check

  # ── Supply chain: RustSec advisory audit ──
  # Plain run step (not rustsec/audit-check): the action can't load a
  # lockfile from a subdirectory, and the workspace lives under rust/.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit committed lockfile
        run: cargo audit

  # ── Unused dependency check (cargo-machete) ──
  # Flags deps declared in rust/Cargo.toml that nothing references.
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install cargo-machete
        uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2.82.6
        with:
          tool: cargo-machete
      - name: Check for unused dependencies
        working-directory: rust
        run: cargo machete

  # ── Lint the workflow files themselves (YAML + embedded shell) ──
  # shellcheck ships on the runner, so actionlint also checks the inline
  # bash. Catches dead runner labels, quoting bugs, and bad expressions
  # before they break a tag release (where failures are most expensive).
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint (SHA-pinned download + checksum)
        run: |
          VER="1.7.12"
          SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" -o actionlint.tgz
          echo "${SHA}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint
