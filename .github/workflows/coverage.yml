name: coverage

# Source-based coverage report for the C/Obj-C parser
# (`c/src/ane_bridge.m` + `c/src/ane_private.m`). Manually
# triggerable; uploads the HTML report as an artifact and prints
# the text summary in the job log.

on:
  workflow_dispatch:

# Deny-all by default; each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: C parser coverage (LLVM source-based)
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show toolchain
        run: |
          xcrun llvm-cov --version
          xcrun llvm-profdata --version

      - name: Generate coverage report
        run: scripts/coverage.sh parser_fuzz corpus

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-coverage-html
          path: target/coverage/html

      - name: Upload text summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-coverage-summary
          path: target/coverage/report.txt
